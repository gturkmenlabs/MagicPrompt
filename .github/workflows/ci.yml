name: CI Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify + Typecheck + Unit + Build + Regression
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify script targets
        run: npm run verify:scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck budget gate
        run: npm run typecheck:budget

      - name: Unit tests
        run: npm run test:run

      - name: Prompt regression
        run: npm run regression:ci

      - name: Build
        run: npm run build

  api-smoke:
    name: API Smoke (supertest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run API smoke tests
        run: npm run test:api:smoke

  playwright-smoke:
    name: Playwright Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        env:
          CI: 'true'
          DISABLE_API_KEY_AUTH: 'true'
          NODE_ENV: 'ci'
        run: npm run test:e2e:smoke
